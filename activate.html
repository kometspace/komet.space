<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Активация • Project Leo</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body data-page="keys">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <button class="burger" type="button" onclick="history.back()">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="brand-title">Project Leo</div>
      </div>

      <div class="top-actions">
        <button class="btn-outline" type="button" onclick="toast('Вход: позже')">Войти</button>
        <button class="star" type="button" onclick="toast('Избранное: позже')">
          <i class="fas fa-star"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="h1">Активация</div>
    <p class="sub">Введи ключ полностью (например: <b>ny_2026</b>)</p>

    <div class="card">
      <div class="section-title">Ключ</div>
      <input id="keyInput" class="input" placeholder="Введите ключ..." />
      <div class="key-actions" style="margin-top:14px">
        <button class="btn-primary" type="button" onclick="activateKey()">Активировать</button>
        <a class="btn-ghost" href="keys.html" style="display:grid;place-items:center;text-decoration:none;">Назад</a>
      </div>

      <div id="keyStatus" class="helper"></div>
      <div class="small-note">
        Ключ сохраняется локально на устройстве (localStorage). На другом телефоне он не появится сам.
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <nav class="bottom-nav">
    <div class="bottom-inner">
      <a class="nav-item" data-page="home" href="index.html"><i class="fas fa-house"></i><span>Главная</span></a>
      <a class="nav-item" data-page="keys" href="keys.html"><i class="fas fa-key"></i><span>Ключи</span></a>
      <a class="nav-item" data-page="profile" href="profile.html"><i class="fas fa-user"></i><span>Профиль</span></a>
    </div>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
